<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>PulseCore</title>

    <link rel="stylesheet" href="popup.css">
    <script src="chart.js"></script>
    <script src="wordcloud.js"></script>

</head>

<body>

    <!-- Extension title -->
    <h1>PulseCore</h1>


    <!-- Video title -->
    <h2 id="videoTitle">
        Loading title...
    </h2>


    <!-- Analyze button -->
    <button id="predictBtn">
        Analyze Comments
    </button>

    <!-- KPI Section -->
    <div id="kpiContainer">

        <div class="kpiCard">

            <h3>Total Comments</h3>

            <p id="totalCommentsKPI">0</p>

        </div>

        <div class="kpiCard">

            <h3>Avg Words / Comment</h3>

            <p id="avgWordsKPI">0</p>

        </div>

    </div>

    <!-- Analytics section -->
    <div id="analysisContainer">

        <h3>Analysis</h3>

        <p>Total Comments: 0</p>

        <p>😊 Positive: 0%</p>

        <p>😐 Neutral: 0%</p>

        <p>😡 Negative: 0%</p>

    </div>

    <div id="chartContainer">

    <canvas id="sentimentChart"></canvas>

    </div>

    <!-- Word Cloud Container -->
    <div id="wordCloudContainer">

        <h3>Trending Words</h3>

        <canvas
            id="wordCloudCanvas"
            width="500"
            height="300">
        </canvas>

    </div>

    <!-- Sentiment Trend Chart -->
    <div id="trendChartContainer">
        <canvas id="trendChart"></canvas>
    </div>

    <!-- Top comments section -->
    <div id="topCommentsContainer">

        <h3>Top Comments</h3>

    </div>


    <script src="popup.js"></script>

</body>
</html>
